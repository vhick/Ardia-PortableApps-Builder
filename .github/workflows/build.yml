name: Build Ardia Windows PortableApps (Stable or Pre-release)
on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Official GitHub release channel (Stable requires a Windows asset on a non-prerelease release)'
        type: choice
        options: [prerelease, stable]
        default: prerelease
      architecture:
        description: Windows target CPU
        type: choice
        options: [x64, arm64]
        default: x64
      requested_version:
        description: Optional exact version for selected channel (blank = latest; prerelease = current rolling Windows alpha)
        type: string
        default: ''
      exact_release_tag:
        description: 'Optional exact upstream GitHub tag (v0.2.47 / windows-alpha / v0.2.47-nightly.9); blank = existing channel behavior'
        type: string
        default: ''
      expected_asset_id:
        description: 'Optional exact GitHub release asset ID; reject if changed'
        type: string
        default: ''
      expected_setup_sha256:
        description: 'SHA-256 of official setup.exe (64 hex); with blank version/tag, FIND matching official release in selected channel'
        type: string
        default: ''
      expected_ardia_exe_sha256:
        description: 'Optional exact SHA-256 of extracted/installed Ardia.exe, NOT setup.exe'
        type: string
        default: ''
      windows_style_data_folders:
        description: 'Use Windows-style Data/Local/Ardia and Data/Roaming/Ardia (OFF = original Data/Profile)'
        type: boolean
        default: true
      no_default_browser_check:
        description: 'Include --no-default-browser-check (recommended)'
        type: boolean
        default: true
      disable_background_mode:
        description: 'Include --disable-background-mode (recommended)'
        type: boolean
        default: true
      disable_logging:
        description: 'Include --disable-logging'
        type: boolean
        default: true
      disable_breakpad:
        description: 'Include --disable-breakpad'
        type: boolean
        default: true
      disable_machine_id:
        description: 'Include --disable-machine-id (UNVERIFIED for Ardia)'
        type: boolean
        default: true
      disable_ardia_update:
        description: 'Include --disable-ardia-update (UNVERIFIED; may do nothing)'
        type: boolean
        default: true
      disable_encryption_win:
        description: 'Include --disable-encryption-win (UNVERIFIED; credential risk; default OFF)'
        type: boolean
        default: false
      publish:
        description: Publish validated ZIP and PortableApps-style installer to this builder's Releases
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: ardia-portable-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 85
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no browser GUI claims)
        run: python -m unittest discover -s tests -v
      - name: Generate compiled launcher flags from checked workflow options
        env:
          ARDIA_OPT_NO_DEFAULT_BROWSER_CHECK: ${{ inputs.no_default_browser_check }}
          ARDIA_OPT_DISABLE_BACKGROUND_MODE: ${{ inputs.disable_background_mode }}
          ARDIA_OPT_DISABLE_LOGGING: ${{ inputs.disable_logging }}
          ARDIA_OPT_DISABLE_BREAKPAD: ${{ inputs.disable_breakpad }}
          ARDIA_OPT_DISABLE_MACHINE_ID: ${{ inputs.disable_machine_id }}
          ARDIA_OPT_DISABLE_ARDIA_UPDATE: ${{ inputs.disable_ardia_update }}
          ARDIA_OPT_DISABLE_ENCRYPTION_WIN: ${{ inputs.disable_encryption_win }}
        run: |
          python scripts/launcher_options.py --out work/launcher-options.json --header launcher/launch_flags.h
          if ($LASTEXITCODE -ne 0) { throw 'Launcher option generation failed' }
          $options = Get-Content -LiteralPath work/launcher-options.json -Encoding UTF8 -Raw | ConvertFrom-Json
          "Ardia launcher options fingerprint: $($options.fingerprint)" >> $env:GITHUB_STEP_SUMMARY
          "Enabled arguments (not all are verified by Ardia): $($options.enabled_arguments -join ', ')" >> $env:GITHUB_STEP_SUMMARY
      - name: Generate compiled data-layout selection from workflow checkbox
        env:
          ARDIA_WINDOWS_STYLE_DATA: ${{ inputs.windows_style_data_folders }}
        run: |
          python scripts/data_layout.py --out work/data-layout.json --header launcher/data_layout.h
          if ($LASTEXITCODE -ne 0) { throw 'Data layout generation failed' }
          $layout = Get-Content -LiteralPath work/data-layout.json -Encoding UTF8 -Raw | ConvertFrom-Json
          "Selected Data layout: $($layout.layout)" >> $env:GITHUB_STEP_SUMMARY
      - name: Resolve official release for selected channel; reject missing stable Windows assets
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          ARCH: ${{ inputs.architecture }}
          REQUEST_VERSION: ${{ inputs.requested_version }}
          EXACT_RELEASE_TAG: ${{ inputs.exact_release_tag }}
          EXPECTED_ASSET_ID: ${{ inputs.expected_asset_id }}
          EXPECTED_SETUP_SHA256: ${{ inputs.expected_setup_sha256 }}
          EXPECTED_APP_SHA256: ${{ inputs.expected_ardia_exe_sha256 }}
        run: |
          python scripts/release.py resolve --arch $env:ARCH --channel $env:RELEASE_CHANNEL --version "$env:REQUEST_VERSION" --release-tag "$env:EXACT_RELEASE_TAG" --expected-asset-id "$env:EXPECTED_ASSET_ID" --expected-setup-sha256 "$env:EXPECTED_SETUP_SHA256" --expected-app-sha256 "$env:EXPECTED_APP_SHA256" --launcher-options work/launcher-options.json --data-layout work/data-layout.json --identity work/identity.json
          if ($LASTEXITCODE -ne 0) { throw 'Release resolver failed' }
          $m = Get-Content -LiteralPath work/identity.json -Raw -Encoding UTF8 | ConvertFrom-Json
          "PKG_CHANNEL=$($m.release_channel)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Selected upstream release: $($m.release_channel) | $($m.release_tag) | $($m.asset_name)" >> $env:GITHUB_STEP_SUMMARY
          "Setup SHA lookup used: $($m.installer_sha_lookup_used)" >> $env:GITHUB_STEP_SUMMARY
          "PKG_VERSION=$($m.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_TAG=$($m.release_tag_for_builder)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_ARCH=$($m.arch)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_OPTIONS_ID=$($m.launcher_flags_fingerprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_LAYOUT_ID=$($m.data_layout_fingerprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_LAYOUT_NAME=$($m.portable_data_layout)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_SOURCE_ID=$($m.source_fingerprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Upstream GitHub asset ID: $($m.asset_id); API digest: $($m.asset_api_digest); exact SHA pin: $($m.expected_setup_sha256)" >> $env:GITHUB_STEP_SUMMARY
          "Expected extracted Ardia.exe SHA-256: $($m.expected_app_sha256)" >> $env:GITHUB_STEP_SUMMARY
      - name: Refuse duplicate builder release identity before large downloads
        if: ${{ inputs.publish }}
        run: |
          python scripts/release.py check-tag --tag $env:PKG_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Existing release or GitHub API failure' }
      - name: Fetch official Windows setup from chosen release, verify size and SHA-256
        run: |
          python scripts/release.py acquire --identity work/identity.json --out work/Ardia-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Official upstream release download failed' }
          $m = Get-Content -LiteralPath work/identity.json -Encoding UTF8 -Raw | ConvertFrom-Json
          "Downloaded upstream setup SHA-256: $($m.download_sha256)" >> $env:GITHUB_STEP_SUMMARY
          if ($m.expected_setup_sha256 -and $m.download_sha256 -ne $m.expected_setup_sha256) { throw 'Pinned setup hash not applied' }
      - name: Extract upstream binary by silent installer on isolated hosted runner ONLY
        run: |
          python scripts/release.py install-ci --identity work/identity.json --installer work/Ardia-Setup.exe --out "$env:RUNNER_TEMP/Ardia-Portable-Extraction"
          if ($LASTEXITCODE -ne 0) { throw 'Controlled runner-only upstream Inno extraction failed' }
          $m = Get-Content -LiteralPath work/identity.json -Encoding UTF8 -Raw | ConvertFrom-Json
          "Extracted upstream Ardia.exe SHA-256: $($m.extracted_app_exe_sha256)" >> $env:GITHUB_STEP_SUMMARY
      - name: Prepare authentic upstream icon for resource compiler
        run: |
          $icon = Join-Path $env:RUNNER_TEMP 'Ardia-Portable-Extraction/Ardia.ico'
          if (!(Test-Path -LiteralPath $icon)) { throw 'Missing upstream icon' }
          Copy-Item -LiteralPath $icon -Destination launcher/appicon.ico
      - name: Compile genuine Windows C++ portable launcher (MSVC, no obfuscation)
        run: |
          # Pin a runner image with documented VS 2022 + MSVC x64/ARM64 toolchains.
          # Avoid relying on the changing windows-2025 VS 2026 rollout and CMake 4.2+.
          ./scripts/build-launcher.ps1 -Architecture $env:PKG_ARCH
      - name: Verify compiled PE contains selected switches and excludes unchecked switches
        run: |
          python scripts/verify_launcher_flags.py --exe build/launcher/Release/ArdiaPortable.exe --manifest work/launcher-options.json --data-layout work/data-layout.json
          if ($LASTEXITCODE -ne 0) { throw 'Compiled launcher switch selection differs from workflow checkboxes' }
      - name: Stage ArdiaPortable with separate Data and licensing
        run: |
          python scripts/release.py stage --identity work/identity.json --install "$env:RUNNER_TEMP/Ardia-Portable-Extraction" --launcher build/launcher/Release/ArdiaPortable.exe --out work/ArdiaPortable
          if ($LASTEXITCODE -ne 0) { throw 'PortableApps staging failed' }
          ./scripts/make-icons.ps1 -Icon work/ArdiaPortable/App/AppInfo/appicon.ico -Out work/ArdiaPortable/App/AppInfo
      - name: Independently validate PortableApps folder and ready-to-extract ZIP
        run: |
          python scripts/release.py validate --identity work/identity.json --root work/ArdiaPortable
          if ($LASTEXITCODE -ne 0) { throw 'Static package validation failed' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/ArdiaPortable_$($env:PKG_CHANNEL)_$($env:PKG_VERSION)_$($env:PKG_ARCH)_b1r11_s$($env:PKG_SOURCE_ID)_f$($env:PKG_OPTIONS_ID)_d$($env:PKG_LAYOUT_ID).zip"
          python scripts/release.py zip --root work/ArdiaPortable --out $zip
          if ($LASTEXITCODE -ne 0) { throw 'Independent ZIP CRC validation failed' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "ZIP $zip SHA256 $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Build PortableApps-style installer with pinned SHARED builder
        id: installer
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: work/ArdiaPortable
          output-dir: dist
          engine: custom-nsis
          running-exe: 'App\Ardia\Ardia.exe'
          package-revision: b1r11-${{ env.PKG_CHANNEL }}-s${{ env.PKG_SOURCE_ID }}-f${{ env.PKG_OPTIONS_ID }}-d${{ env.PKG_LAYOUT_ID }}
          timeout-seconds: '1200'
      - name: Independently inspect compiled installer and hashes
        run: |
          $exe = '${{ steps.installer.outputs.installer-file }}'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Pinned installer action did not return a real installer path' }
          ./scripts/verify-installer.ps1 -Installer $exe
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ steps.installer.outputs.installer-sha256 }}'.ToLowerInvariant()) { throw 'Installer SHA-256 output mismatch' }
          "Installer PE/hash validation passed; execution verified by separate test step." >> $env:GITHUB_STEP_SUMMARY
      - name: Headless installer Data-root and seeded-layout reinstall preservation smoke test
        run: |
          ./scripts/test-installer.ps1 -Layout $env:PKG_LAYOUT_NAME -Installer '${{ steps.installer.outputs.installer-file }}'
          "Pinned installer created top-level Data; installer reinstall preserved seeded selected-layout folders, a Data marker, and nested empty directories. Actual browser first-launch layout creation, cross-version upgrade, GUI and rollback unverified." >> $env:GITHUB_STEP_SUMMARY
      - name: Shared release publisher mandatory dry-run
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: ${{ env.PKG_TAG }}
          release-title: Ardia ${{ env.PKG_VERSION }} Windows ${{ env.PKG_ARCH }} PortableApps b1r11 ${{ env.PKG_CHANNEL }} source-${{ env.PKG_SOURCE_ID }} flags-${{ env.PKG_OPTIONS_ID }} layout-${{ env.PKG_LAYOUT_NAME }} (unofficial)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Publish after all successful static/package checks
        if: ${{ inputs.publish }}
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: ${{ env.PKG_TAG }}
          release-title: Ardia ${{ env.PKG_VERSION }} Windows ${{ env.PKG_ARCH }} PortableApps b1r11 ${{ env.PKG_CHANNEL }} source-${{ env.PKG_SOURCE_ID }} flags-${{ env.PKG_OPTIONS_ID }} layout-${{ env.PKG_LAYOUT_NAME }} (unofficial)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
      - name: Preserve validated ZIP as short-lived workflow artifact if installer/publisher fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ArdiaPortable-validated-ZIP-recovery
          path: dist/ArdiaPortable_*.zip
          if-no-files-found: ignore
          retention-days: 3
      - name: Explicit test caveat
        if: always()
        run: |
          "This workflow does not establish full Windows interactive portability, shell notification behavior, installed-Ardia coexistence or installer upgrade/rollback execution." >> $env:GITHUB_STEP_SUMMARY
